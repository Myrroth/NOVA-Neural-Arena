[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nova-neural-arena"
version = "0.1.0"
description = "Independent, reproducible reinforcement learning laboratory starting with Snake"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26,<3",
  "gymnasium>=1.0,<2",
  "torch>=2.3,<3",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]
reporting = ["matplotlib>=3.10,<4"]

[tool.setuptools.packages.find]
include = ["arena*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
