name: Validate Snake (PR or manual)
on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements-ci.txt
      - name: Install pinned CPU dependencies
        run: |
          python -m pip install 'torch==2.10.0' --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -c requirements-ci.txt -e '.[dev]'
          python -m pip check
      - name: Record installed dependency versions
        run: python -m pip freeze > dependencies-resolved.txt
      - name: Run automated tests (official Gymnasium)
        run: python -m pytest -q
      - name: Explicit Gymnasium env_checker
        run: |
          python - <<'PYCODE'
          import gymnasium
          from gymnasium.utils.env_checker import check_env
          from arena.envs.snake import SnakeEnv
          print('Official Gymnasium:', gymnasium.__version__)
          for mode in (None, 'ansi'):
              env = SnakeEnv(width=8, height=8, max_steps=40, render_mode=mode)
              try:
                  check_env(env, skip_render_check=False)
              finally:
                  env.close()
          print('Gymnasium env_checker: PASS')
          PYCODE
      - name: Upload dependency audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dependencies-${{ github.run_id }}
          path: dependencies-resolved.txt
          if-no-files-found: warn
          retention-days: 14
