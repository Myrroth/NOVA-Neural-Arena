name: Laboratory infrastructure (synthetic checks only)

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [feat/phase4-startstate-robustness]

permissions:
  contents: read

concurrency:
  group: lab-infrastructure-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  infrastructure:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.base.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
    steps:
      - name: Checkout the proposed infrastructure
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Keep historical executable files identical to frozen commits
        shell: bash
        run: |
          set -euo pipefail
          git diff --exit-code 24bd38e9e78a14e894f32d7d1c5b5b6d6d724463 HEAD -- arena/envs/snake.py arena/agents/dqn.py arena/training/train.py arena/evaluation/benchmark.py
          git diff --exit-code f9e1b171a8c045f8bd7c874432114e4bc654665e HEAD -- arena/evaluation/frozen_phase2.py
          git diff --exit-code 8892980eccfb623de30f3803a7550aa1fa31a9c6 HEAD -- arena/evaluation/phase3_generalization.py
          git diff --exit-code 8b4b6696e980191349e803218af6e6d55d8ff7e9 HEAD -- arena/evaluation/phase4_startstates.py

      - name: Install Python 3.11
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements-ci.txt

      - name: Install official pinned CPU libraries
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install 'torch==2.10.0' --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -c requirements-ci.txt -e '.[dev]'
          python -m pip check
          python -m compileall -q arena tests

      - name: Run the complete small synthetic test suite
        shell: bash
        run: |
          set -euo pipefail
          python -m pytest -q

      - name: Validate the candidate Phase 5 design without episodes
        shell: bash
        run: |
          set -euo pipefail
          python -m arena.evaluation.phase5_hardstates --validate-only > "$RUNNER_TEMP/phase5-candidate.json"
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          manifest = json.loads((Path(os.environ['RUNNER_TEMP']) / 'phase5-candidate.json').read_text())
          assert manifest['status'] == 'UNAPPROVED'
          assert manifest['no_training'] is True
          assert manifest['initial_rng_draws'] == 0
          print('Validated candidate geometry; no official campaign or checkpoint evaluation.')
          PY
