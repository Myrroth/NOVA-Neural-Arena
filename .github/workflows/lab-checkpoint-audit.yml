name: Official checkpoint load audit (NO games)

on:
  pull_request:
    types: [labeled]
    branches: [feat/phase4-startstate-robustness]

permissions:
  contents: read
  actions: read

concurrency:
  group: lab-checkpoint-load-audit-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  load-only:
    if: >-
      github.event.label.name == 'lab-checkpoint-load-audit' &&
      github.event.pull_request.number == 5 &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.base.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'feat/lab-preservation-phase5' &&
      github.event.pull_request.base.ref == 'feat/phase4-startstate-robustness'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
    steps:
      - name: Checkout the already tested immutable loader, never mutable PR HEAD
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: 6faec4b5a2524a801e71c7f72f8e4859a2eb5d2b
          persist-credentials: false
      - name: Check exact tested source identity
        run: test "$(git rev-parse HEAD)" = '6faec4b5a2524a801e71c7f72f8e4859a2eb5d2b'
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements-ci.txt
      - name: Install official CPU dependencies
        run: |
          python -m pip install 'torch==2.10.0' --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -c requirements-ci.txt -e '.[dev]'
          python -m pip check
      - name: Download exact three pilot artifacts for audit only
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          artifact-ids: '13101471957,13101072100,13100988601'
          run-id: 41350959549
          repository: ${{ github.repository }}
          github-token: ${{ github.token }}
          path: audit-input
      - name: Verify identities and frozen loading WITHOUT inference, games or optimizer
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import platform
          from pathlib import Path
          import gymnasium
          import numpy
          import torch
          from arena.evaluation.frozen_phase2 import ARTIFACTS, weights_fingerprint
          from arena.shared.checkpoints import load_official_checkpoint
          records = []
          before = torch.random.get_rng_state().clone()
          for seed in (11, 42, 73):
              folder = Path('audit-input') / f'snake-pilot-seed-{seed}-run-41350959549-attempt-1'
              network = load_official_checkpoint(folder, seed=seed)
              assert not network.training
              assert all(not p.requires_grad and p.grad is None for p in network.parameters())
              assert torch.equal(before, torch.random.get_rng_state())
              records.append({'seed': seed, 'artifact_id': ARTIFACTS[seed][0],
                              'model_sha256': ARTIFACTS[seed][1],
                              'weights_fingerprint': weights_fingerprint(network),
                              'frozen': True, 'rng_preserved': True})
          print('AUDIT_RESULT ' + json.dumps({
              'source_commit': '6faec4b5a2524a801e71c7f72f8e4859a2eb5d2b',
              'official_episodes_executed': 0, 'training_executed': False,
              'versions': {'python': platform.python_version(), 'torch': torch.__version__,
                           'numpy': numpy.__version__, 'gymnasium': gymnasium.__version__},
              'models': records,
          }, sort_keys=True))
          PY
