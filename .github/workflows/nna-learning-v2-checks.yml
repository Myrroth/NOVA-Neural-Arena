name: Learning v2 engineering checks (no campaign)
on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]
    branches: [feat/nna-multigame-002]
permissions:
  contents: read
concurrency:
  group: learning-v2-checks-${{ github.event.pull_request.number }}
  cancel-in-progress: false
jobs:
  verify:
    if: github.event.action != 'labeled'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Preserve all historical scientific implementations
        run: git diff --exit-code 38b4ffb62bec74eead91e80eadc199fcdd7c9471 HEAD -- arena/universal arena/shared arena/envs arena/agents arena/training arena/evaluation
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.11.17'
      - name: Install pinned CPU dependencies
        run: |
          python -m pip install 'torch==2.10.0' --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -c requirements-ci.txt -e '.[dev]'
          python -m pip install -c requirements-reporting.txt '.[reporting]'
          python -m pip check
      - name: Compile and run the complete engineering suite
        run: |
          python -m compileall -q arena tests
          python -m pytest -q
  synthetic-cost-once:
    if: >-
      github.event.action == 'labeled' &&
      github.event.label.name == 'nna-v2-synthetic-cost-once' &&
      github.run_attempt == 1 &&
      github.event.pull_request.number == 14 &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.base.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'fix/nna-learning-v2'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      OMP_NUM_THREADS: '2'
      MKL_NUM_THREADS: '2'
      OPENBLAS_NUM_THREADS: '2'
      PROFILE_SUBDIRECTORY: learning-v2-synthetic-cost
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.11.17'
      - name: Install pinned CPU dependencies for artificial tensors
        run: |
          python -m pip install 'torch==2.10.0' --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -c requirements-ci.txt -e '.[dev]'
          python -m pip check
      - name: Single bounded synthetic profile (no games or historical models)
        run: >-
          timeout --signal=TERM --kill-after=15s 180s
          python scripts/profile_continual_synthetic.py --run
          --output "$RUNNER_TEMP/$PROFILE_SUBDIRECTORY" --updates 100 --forwards 100
          --context-length 16 --threads 2
      - name: Preserve cost measurements, including a stopped profile
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: learning-v2-synthetic-cost-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/learning-v2-synthetic-cost/
          if-no-files-found: error
          retention-days: 14
