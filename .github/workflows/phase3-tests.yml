name: Phase 3 infrastructure checks (NO campaign)

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [feat/phase2-frozen-evaluation]

permissions:
  contents: read
  actions: read

jobs:
  phase3-validation:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements-ci.txt
      - name: Install official pinned libraries
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install 'torch==2.10.0' --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -c requirements-ci.txt -e '.[dev]'
          python -m pip check
          python -m compileall -q arena tests
      - name: Run synthetic Phase 3 tests and real Snake API tests only
        run: python -m pytest -q tests/test_phase3_generalization.py tests/test_phase3_workflow_pin.py tests/test_snake.py

      - name: Download exact official seed 11 artifact (audit only)
        uses: actions/download-artifact@v8
        with:
          name: snake-pilot-seed-11-run-41350959549-attempt-1
          run-id: 41350959549
          repository: ${{ github.repository }}
          github-token: ${{ github.token }}
          path: experiments/phase3/official/seed_11
      - name: Download exact official seed 42 artifact (audit only)
        uses: actions/download-artifact@v8
        with:
          name: snake-pilot-seed-42-run-41350959549-attempt-1
          run-id: 41350959549
          repository: ${{ github.repository }}
          github-token: ${{ github.token }}
          path: experiments/phase3/official/seed_42
      - name: Download exact official seed 73 artifact (audit only)
        uses: actions/download-artifact@v8
        with:
          name: snake-pilot-seed-73-run-41350959549-attempt-1
          run-id: 41350959549
          repository: ${{ github.repository }}
          github-token: ${{ github.token }}
          path: experiments/phase3/official/seed_73

      - name: Verify hashes and freeze models; DO NOT evaluate official episodes
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PYCODE'
          from pathlib import Path
          from arena.evaluation.frozen_phase2 import (
              TRAIN_SEEDS, load_verified_model, verify_artifact_directory, weights_fingerprint
          )
          root = Path("experiments/phase3/official")
          for seed in TRAIN_SEEDS:
              folder = root / f"seed_{seed}"
              provenance = verify_artifact_directory(folder, seed=seed)
              model = load_verified_model(folder, seed=seed, verified=provenance)
              assert not model.training
              assert all(not p.requires_grad and p.grad is None for p in model.parameters())
              assert len(weights_fingerprint(model)) == 64
              print(f"Official checkpoint {seed}: integrity PASS, no episode")
          PYCODE
