# Workflow-only B for exact review. Publication does not authorize execution.
# Fixed source A / protocol P; actual human consent and Planning review required.
name: NNA CONTINUAL 003 single newly approved campaign
on:
  pull_request:
    types: [labeled]
    branches: [feat/nna-multigame-002]
permissions:
  contents: read
concurrency:
  group: nna-continual-003-single-campaign
  cancel-in-progress: false
env:
  SOURCE_COMMIT: 602fc18cfdfdac6efab51c272b83b9ca3afd7455
  PROTOCOL_SHA256: 350f5edef5bc4bbdd86f0c960a8728169612ce4fb279292e9cc83717fb73bbf9
  NNA003_WORKFLOW_REVISION: ${{ github.event.pull_request.head.sha }}
  OMP_NUM_THREADS: '2'
  MKL_NUM_THREADS: '2'
  OPENBLAS_NUM_THREADS: '2'
jobs:
  authorization:
    if: >-
      github.event.label.name == 'nna-continual003-campaign-approved' &&
      github.run_attempt == 1 &&
      github.event.pull_request.number == 14 &&
      github.event.pull_request.head.ref == 'fix/nna-learning-v2' &&
      github.event.pull_request.head.repo.full_name == 'Myrroth/NOVA-Neural-Arena' &&
      github.event.pull_request.base.repo.full_name == 'Myrroth/NOVA-Neural-Arena'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
    outputs:
      receipt_sha256: ${{ steps.reserve.outputs.receipt_sha256 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify actual approvals and reserve once before any ML setup
        id: reserve
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          python3 -m arena.continual.workflow_reservation
          --expected-source "$SOURCE_COMMIT"
          --expected-workflow "$NNA003_WORKFLOW_REVISION"
          --expected-protocol "$PROTOCOL_SHA256"
          --output "$RUNNER_TEMP/nna003-gate"
      - name: Preserve the authorization receipt or failure evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: nna003-gate-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/nna003-gate/
          if-no-files-found: warn
          retention-days: 7
  scientific-once:
    needs: authorization
    if: needs.authorization.result == 'success' && github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    permissions:
      contents: read
      actions: read
    env:
      NNA003_RECEIPT_SHA256: ${{ needs.authorization.outputs.receipt_sha256 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.SOURCE_COMMIT }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: nna003-gate-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/nna003-gate
      - name: Preserve all historical scientific implementations
        run: git diff --exit-code 38b4ffb62bec74eead91e80eadc199fcdd7c9471 HEAD -- arena/universal arena/shared arena/envs arena/agents arena/training arena/evaluation
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.11.17'
      - name: Install the fixed CPU runtime without a write token
        run: |
          python -m pip install 'torch==2.10.0' --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -c requirements-ci.txt -e '.[dev]'
          python -m pip check
      - name: One finite training campaign and one final evaluation
        run: |
          set -euo pipefail
          export NNA003_GATE_DIR="$RUNNER_TEMP/nna003-gate"
          python -m arena.continual.campaign --train-once --output experiments/continual-003-scientific --permit "$NNA003_GATE_DIR/permit.json"
          python -m arena.continual.campaign --evaluate-final-once --output experiments/continual-003-scientific --permit "$NNA003_GATE_DIR/permit.json"
      - name: Preserve results and partial artifacts once, including failures
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: nna003-scientific-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/nna003-gate/
            experiments/continual-003-scientific/
          if-no-files-found: warn
          retention-days: 7
# No dispatch, matrix, retry or resume. The reservation survives any failure.
# The learner never receives the reservation job's issues-write credential.
