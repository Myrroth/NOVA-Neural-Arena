name: Phase 2 infrastructure tests (no evaluation campaign)

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [feat/snake-dqn-laboratory]

permissions:
  contents: read

jobs:
  frozen-evaluation-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements-ci.txt
      - name: Install official dependencies (CPU only)
        run: |
          python -m pip install 'torch==2.10.0' --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -c requirements-ci.txt -e '.[dev]'
          python -m pip check
      - name: Run unit tests only, no official model evaluation
        run: python -m pytest -q
