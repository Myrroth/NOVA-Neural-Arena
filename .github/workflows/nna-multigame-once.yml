# Fixed preparation for review. Publication alone does not authorize science.
# After fixing source A / protocol hash / CI, replace both sentinels and
# publish as a workflow-only commit B FOR REVIEW. This publication grants
# no consent: NEW human approval and Chat1 recertification remain mandatory.
# No campaign label or owner approval record may be created before consent.
# Approval must bind BOTH A and B.
name: NNA MULTIJOGOS 002 single approved campaign

on:
  pull_request:
    types: [labeled]
    branches: [chore/nna-closure-final]

permissions:
  contents: read
  issues: write

concurrency:
  group: nna-multigame-002-single-campaign
  cancel-in-progress: false

jobs:
  once:
    if: >-
      github.event.label.name == 'nna-mg002-campaign-approved' &&
      github.event.pull_request.number == 13 &&
      github.event.pull_request.head.ref == 'feat/nna-multigame-002' &&
      github.event.pull_request.head.repo.full_name == 'Myrroth/NOVA-Neural-Arena'
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    env:
      SOURCE_COMMIT: dc71247b2269d41c8d2aeb8c7d489977fac3ad3a
      PROTOCOL_SHA256: 93591ede5951438f92432fc6601773aaafe28b2ba5840309aa7bd3611170a324
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Authenticate approval and consume remote reservation before setup
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          python3 -m arena.universal.workflow_reservation
          --expected-source "$SOURCE_COMMIT"
          --expected-protocol "$PROTOCOL_SHA256"
          --output "$RUNNER_TEMP/nna-mg002-gate"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.SOURCE_COMMIT }}
          fetch-depth: 0
          persist-credentials: false
      - name: Historical scientific code must remain unchanged
        run: git diff --exit-code bce5db99f38466119a0818e36312b1f82072615d HEAD -- arena/envs arena/agents arena/training arena/evaluation arena/shared
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.11'
      - name: Install the approved CPU runtime
        run: |
          python -m pip install 'torch==2.10.0' --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -c requirements-ci.txt -e '.[dev]'
          python -m pip check
      - name: One training campaign followed by one final evaluation
        run: |
          set -euo pipefail
          python -m arena.universal.campaign --train-once --output experiments/multigame-002-scientific --permit "$RUNNER_TEMP/nna-mg002-gate/permit.json"
          python -m arena.universal.campaign --evaluate-final-once --output experiments/multigame-002-scientific --permit "$RUNNER_TEMP/nna-mg002-gate/permit.json"
      - name: Preserve results and partial artifacts even after failure
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: nna-mg002-once-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/nna-mg002-gate
            experiments/multigame-002-scientific
          if-no-files-found: warn
          retention-days: 7

# No workflow_dispatch, matrix, resume, rerun or retries. The remote gate
# rejects run_attempt != 1 and any earlier reservation, even on failure.
# Public standard Ubuntu compute only; no paid runner or billing changes.
# Analysis/viewer/causal trace are offline steps after verified download.
