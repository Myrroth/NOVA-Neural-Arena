name: Approved Snake pilot (PR label)

on:
  pull_request:
    types: [labeled]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: snake-pilot-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  approved-pilot:
    if: >-
      github.event.action == 'labeled' &&
      github.event.label.name == 'neural-pilot-approved' &&
      github.event.pull_request.number == 1 &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.base.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'feat/snake-dqn-laboratory' &&
      github.event.pull_request.base.ref == 'main'
    name: Snake pilot seed ${{ matrix.seed }}
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        seed: [11, 42, 73]
    env:
      APPROVED_SHA: 24bd38e9e78a14e894f32d7d1c5b5b6d6d724463
      PILOT_SEED: ${{ matrix.seed }}
      OUTPUT_DIR: experiments/chat3/seed_${{ matrix.seed }}
    steps:
      - name: Checkout exactly the approved source commit (not the PR merge ref)
        uses: actions/checkout@v7
        with:
          ref: 24bd38e9e78a14e894f32d7d1c5b5b6d6d724463
          persist-credentials: false

      - name: Verify immutable source and create provenance
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$APPROVED_SHA"
          mkdir -p "$OUTPUT_DIR"
          git rev-parse HEAD > "$OUTPUT_DIR/commit.txt"
          python - <<'PYCODE'
          import json
          import os
          from pathlib import Path

          output = Path(os.environ["OUTPUT_DIR"])
          provenance = {
              "approved_commit": os.environ["APPROVED_SHA"],
              "seed": int(os.environ["PILOT_SEED"]),
              "training_episodes": 80,
              "evaluation_episodes": 20,
              "width": 10,
              "height": 10,
              "max_steps": 200,
              "workflow": "neural-pilot-on-label.yml",
              "trigger": "pull_request.labeled",
              "authorization_label": "neural-pilot-approved",
              "pull_request_number": 1,
              "github_run_id": os.environ["GITHUB_RUN_ID"],
              "github_run_attempt": os.environ["GITHUB_RUN_ATTEMPT"],
              "github_repository": os.environ["GITHUB_REPOSITORY"],
              "runner_os": os.environ["RUNNER_OS"],
          }
          (output / "provenance.json").write_text(
              json.dumps(provenance, indent=2, sort_keys=True) + "\n", encoding="utf-8"
          )
          PYCODE

      - name: Set up Python 3.11
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements-ci.txt

      - name: Install official pinned CPU dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install 'torch==2.10.0' --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -c requirements-ci.txt -e '.[dev]'
          python -m pip check
          python -m pip freeze > "$OUTPUT_DIR/pip-freeze.txt"

      - name: Verify official Gymnasium and existing tests
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PYCODE'
          import gymnasium
          import torch
          from gymnasium.utils.env_checker import check_env
          from arena.envs.snake import SnakeEnv
          assert gymnasium.__version__ == "1.4.0"
          assert torch.__version__.startswith("2.10.0")
          env = SnakeEnv(width=10, height=10, max_steps=200)
          try:
              check_env(env)
          finally:
              env.close()
          print("Official Gymnasium:", gymnasium.__version__)
          print("Official PyTorch:", torch.__version__)
          PYCODE
          python -m pytest -q

      - name: Run exactly one approved short training (seed ${{ matrix.seed }})
        shell: bash
        run: |
          set -euo pipefail
          python -m arena.training.train \
            --seed "$PILOT_SEED" \
            --episodes 80 \
            --eval-episodes 20 \
            --width 10 \
            --height 10 \
            --max-steps 200 \
            --out "$OUTPUT_DIR"

      - name: Verify required outputs and record SHA-256 checksums
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PYCODE'
          import json
          import os
          from pathlib import Path

          output = Path(os.environ["OUTPUT_DIR"])
          seed = int(os.environ["PILOT_SEED"])
          for filename in ("model.pt", "episodes.csv", "evaluation.json", "run.json",
                           "provenance.json", "commit.txt", "pip-freeze.txt"):
              path = output / filename
              assert path.is_file() and path.stat().st_size > 0, path
          run = json.loads((output / "run.json").read_text(encoding="utf-8"))
          evaluation = json.loads((output / "evaluation.json").read_text(encoding="utf-8"))
          provenance = json.loads((output / "provenance.json").read_text(encoding="utf-8"))
          assert run["seed"] == seed
          assert run["episodes"] == 80 and run["eval_episodes"] == 20
          assert (run["width"], run["height"], run["max_steps"]) == (10, 10, 200)
          assert run["training_seeds"] == [seed, seed + 79]
          assert evaluation["seeds"] == list(range(seed + 100_000, seed + 100_020))
          assert len(evaluation["trained"]["episodes"]) == 20
          assert len(evaluation["random"]["episodes"]) == 20
          assert provenance["approved_commit"] == os.environ["APPROVED_SHA"]
          assert (output / "commit.txt").read_text().strip() == os.environ["APPROVED_SHA"]
          print("Verified protocol and files for seed", seed)
          PYCODE
          (cd "$OUTPUT_DIR" && sha256sum model.pt episodes.csv evaluation.json run.json \
            provenance.json commit.txt pip-freeze.txt > SHA256SUMS)

      - name: Preserve pilot artifacts even on partial failure
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: snake-pilot-seed-${{ matrix.seed }}-run-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: experiments/chat3/seed_${{ matrix.seed }}/
          if-no-files-found: warn
          retention-days: 30
