name: NNA multigame engineering (NO official campaign)

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]
    branches: [chore/nna-closure-final]

permissions:
  contents: read

concurrency:
  group: nna-multigame-ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  verify:
    if: github.event.action != 'labeled' || github.event.label.name == 'nna-mg002-preflight'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: |
            requirements-ci.txt
            requirements-reporting.txt
      - name: Historical scientific code must remain identical
        shell: bash
        run: |
          set -euo pipefail
          git diff --exit-code bce5db99f38466119a0818e36312b1f82072615d HEAD -- arena/envs arena/agents arena/training arena/evaluation arena/shared
      - name: Install pinned CPU dependencies
        run: |
          python -m pip install 'torch==2.10.0' --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -c requirements-ci.txt -e '.[dev]'
          python -m pip install -c requirements-reporting.txt '.[reporting]'
          python -m pip check
      - name: Full engineering tests, no scientific models or campaign
        run: |
          python -m compileall -q arena tests scripts
          python -m pytest -q
      - name: Bounded mechanical and synthetic preflight, no scientific learning
        if: github.event.action == 'labeled' && github.event.label.name == 'nna-mg002-preflight'
        run: |
          python -m arena.universal.engineering --run --output experiments/multigame-002-preflight
      - name: Preserve technical preflight receipt
        if: always() && github.event.action == 'labeled' && github.event.label.name == 'nna-mg002-preflight'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: nna-mg002-preflight-${{ github.run_id }}
          path: experiments/multigame-002-preflight
          if-no-files-found: warn
          retention-days: 30
